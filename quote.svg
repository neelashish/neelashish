<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
<rect width="320" height="210" fill="#0d1117" rx="10"/>
<rect width="320" height="26" fill="#161b22" rx="10"/>
<rect width="320" height="13" y="13" fill="#161b22"/>
<rect width="319.5" height="209.5" x=".25" y=".25" fill="none" stroke="#21262d" stroke-width=".5" rx="10"/>
<circle cx="16" cy="13" r="4" fill="#ff5f57"/>
<circle cx="30" cy="13" r="4" fill="#ffbd2e"/>
<circle cx="44" cy="13" r="4" fill="#28c941"/>
<text x="160" y="13" text-anchor="middle" fill="#8b949e" font-family="'Courier New',monospace" font-size="10" dominant-baseline="middle">kakashi.hatake</text>
<rect x="14" y="34" width="4" height="142" fill="#f97316" rx="2"/>
<text x="26" y="62" fill="#f97316" font-family="Georgia,serif" font-size="48" opacity="0.25">“</text>
<text x="26" y="58" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11">Those who break the</text>
<text x="26" y="75" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11">rules are scum,</text>
<text x="26" y="92" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11"></text>
<text x="26" y="109" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11">but those who abandon</text>
<text x="26" y="126" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11">their friends are</text>
<text x="26" y="143" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11">worse than scum.</text>
<text x="26" y="160" fill="#8b949e" font-family="'Courier New',Consolas,monospace" font-size="11"></text>
<text x="26" y="177" fill="#f97316" font-family="'Courier New',Consolas,monospace" font-size="11">— Hatake Kakashi</text>
<circle cx="144" cy="196" r="3" fill="#f97316" opacity="0.6"/>
<circle cx="160" cy="196" r="3" fill="#c00" opacity="0.6"/>
<circle cx="176" cy="196" r="3" fill="#f97316" opacity="0.6"/>
</svg>